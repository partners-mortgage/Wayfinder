/* ---------- proxy helpers (send the signed-in user's token) ---------- */
const PROXY = (CFG.PROXY_URL||"").replace(/\/+$/,"");
async function authHeaders(force){
  const h = { "Content-Type":"application/json" };
  try{
    const u = auth && auth.currentUser;
    if(u){ const t = await u.getIdToken(!!force); h["Authorization"] = "Bearer " + t; }
  }catch{}
  return h;
}
/* Post to the proxy. If it answers 401, the token may be stale (for example
   it was issued before the email was verified), so refresh once and retry. */
async function postProxy(path, body){
  let r = await fetch(PROXY + path, { method:"POST", headers: await authHeaders(false), body: JSON.stringify(body) });
  if(r.status === 401){
    r = await fetch(PROXY + path, { method:"POST", headers: await authHeaders(true), body: JSON.stringify(body) });
  }
  return r;
}
async function callClaude(payload){ return postProxy("/claude", payload); }
async function callRender(body){ return postProxy("/render", body); }
async function callUploadUrl(body){ return postProxy("/upload-url", body); }
/* GET through the proxy (used for job status polling) */
async function getProxy(path){
  let r = await fetch(PROXY + path, { headers: await authHeaders(false) });
  if(r.status === 401){ r = await fetch(PROXY + path, { headers: await authHeaders(true) }); }
  return r;
}

/* ---------- resilient storage ---------- */
const memStore = {};
const store = {
  get(k){
    try{ const v=localStorage.getItem(k); if(v!==null) return v; }catch{}
    try{ const m=document.cookie.match(new RegExp("(?:^|; )"+k+"=([^;]*)")); if(m) return decodeURIComponent(m[1]); }catch{}
    return k in memStore ? memStore[k] : null;
  },
  set(k,v){ memStore[k]=v; let ok=false;
    try{ localStorage.setItem(k,v); ok=true; }catch{}
    if(!ok){ try{ document.cookie = `${k}=${encodeURIComponent(v)}; path=/; max-age=${60*60*24*180}; SameSite=Lax`; }catch{} }
  },
  del(k){ delete memStore[k]; try{ localStorage.removeItem(k); }catch{} try{ document.cookie = `${k}=; path=/; max-age=0`; }catch{} }
};

/* ================================================================ */
function App(){
  const [state,setState] = useState({ phase:"loading", user:null });

  useEffect(()=>{
    if(!FB_ON || !auth){ setState({ phase:"noauth", user:null }); return; }
    const unsub = auth.onAuthStateChanged(async (u)=>{
      if(!u){ setState({ phase:"signedout", user:null }); return; }
      // reload so a just-clicked verification link is reflected
      try{ await u.reload(); }catch{}
      const email = (u.email||"").toLowerCase();
      if(!isAllowedEmail(email)){
        try{ await auth.signOut(); }catch{}
        setState({ phase:"signedout", user:null, notice:"That address isn't a Partners Mortgage account." });
        return;
      }
      if(!u.emailVerified){ setState({ phase:"unverified", user:u }); return; }
      // Mint a FRESH token. A token minted before the verification link was
      // clicked still carries email_verified:false, which the proxy rejects.
      try{ await u.getIdToken(true); }catch{}
      setState({ phase:"in", user:u, email, admin:isAdminEmail(email) });
    });
    return ()=>unsub();
  },[]);

  if(state.phase==="loading") return <Splash label="Loading…"/>;
  if(state.phase==="noauth") return <Splash label="Sign-in isn't configured yet." sub="Add your Firebase config to enable accounts."/>;
  if(state.phase==="signedout") return <AuthGate notice={state.notice}/>;
  if(state.phase==="unverified") return <VerifyNotice user={state.user}/>;
  return <Studio me={{ email:state.email, admin:state.admin, user:state.user }}/>;
}

/* ================= Sign in / sign up ================= */
function AuthGate({ notice }){
  const [mode,setMode] = useState("in");      // "in" | "up" | "reset"
  const [email,setEmail] = useState("");
  const [pw,setPw] = useState("");
  const [busy,setBusy] = useState(false);
  const [msg,setMsg] = useState(notice||"");
  const [good,setGood] = useState("");

  const go = async ()=>{
    setMsg(""); setGood("");
    const e = email.trim().toLowerCase();
    if(!e || (mode!=="reset" && !pw)){ setMsg("Enter your email and password."); return; }
    if(!isAllowedEmail(e)){ setMsg(`Use your @${DOMAIN} email address.`); return; }
    setBusy(true);
    try{
      if(mode==="up"){
        const cred = await auth.createUserWithEmailAndPassword(e, pw);
        try{ await cred.user.sendEmailVerification(); }catch{}
        setGood("Account created. Check your email for the verification link.");
      } else if(mode==="reset"){
        await auth.sendPasswordResetEmail(e);
        setGood("Password reset email sent.");
      } else {
        await auth.signInWithEmailAndPassword(e, pw);
      }
    }catch(err){
      const c = (err && err.code) || "";
      setMsg(
        c==="auth/invalid-credential" || c==="auth/wrong-password" || c==="auth/user-not-found" ? "That email and password didn't match."
        : c==="auth/email-already-in-use" ? "An account already exists for that email. Try signing in."
        : c==="auth/weak-password" ? "Use at least 6 characters for the password."
        : c==="auth/too-many-requests" ? "Too many attempts. Wait a moment and try again."
        : c==="auth/invalid-email" ? "That email address doesn't look right."
        : (err && err.message) || "Something went wrong."
      );
    }finally{ setBusy(false); }
  };

  return (
    <Shell>
      <div style={{background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.14)",borderRadius:16,padding:"20px 20px 22px",textAlign:"left"}}>
        <div className="u" style={{fontSize:11,fontWeight:700,letterSpacing:".12em",color:"var(--amber-500)",marginBottom:14,textAlign:"center"}}>
          {mode==="up"?"CREATE YOUR ACCOUNT":mode==="reset"?"RESET PASSWORD":"SIGN IN"}
        </div>
        <label className="u" style={{fontSize:10,fontWeight:700,letterSpacing:".08em",color:"var(--sand-300)",display:"block",marginBottom:6}}>Work email</label>
        <input value={email} autoFocus autoComplete="username" onChange={e=>setEmail(e.target.value)}
          onKeyDown={e=>{ if(e.key==="Enter") go(); }} placeholder={`you@${DOMAIN}`} style={{...inpDark,marginBottom:12}}/>
        {mode!=="reset" && <>
          <label className="u" style={{fontSize:10,fontWeight:700,letterSpacing:".08em",color:"var(--sand-300)",display:"block",marginBottom:6}}>Password</label>
          <input type="password" value={pw} autoComplete={mode==="up"?"new-password":"current-password"}
            onChange={e=>setPw(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") go(); }}
            placeholder={mode==="up"?"at least 6 characters":"••••••••"} style={{...inpDark,marginBottom:4}}/>
        </>}
        {msg && <div style={{color:"#ffb4b8",fontSize:12.5,marginTop:10}}>{msg}</div>}
        {good && <div style={{color:"#cfe89a",fontSize:12.5,marginTop:10}}>{good}</div>}
        <button onClick={go} disabled={busy} className="u" style={{...btn.amber,width:"100%",justifyContent:"center",marginTop:14,opacity:busy?.6:1}}>
          {busy?<Spinner sm/>:(mode==="up"?"Create account":mode==="reset"?"Send reset email":"Sign in")}
        </button>
        <div style={{display:"flex",justifyContent:"space-between",marginTop:14,fontSize:12}}>
          {mode==="in" ? (
            <>
              <button onClick={()=>{setMode("up");setMsg("");setGood("");}} style={linkBtn}>Create an account</button>
              <button onClick={()=>{setMode("reset");setMsg("");setGood("");}} style={linkBtn}>Forgot password</button>
            </>
          ) : (
            <button onClick={()=>{setMode("in");setMsg("");setGood("");}} style={linkBtn}>Back to sign in</button>
          )}
        </div>
      </div>
      <p style={{fontSize:11.5,color:"var(--sand-500)",marginTop:18,lineHeight:1.5}}>
        Anyone with a Partners Mortgage email can create an account and watch guides. Recording is limited to training admins.
      </p>
    </Shell>
  );
}
const initials = (email)=>{ const n=(email||"").split("@")[0].replace(/[^a-z]/gi," ").trim().split(/\s+/); return ((n[0]||"?")[0]+((n[1]||"")[0]||"")).toUpperCase(); };
const linkBtn = { background:"none",border:"none",color:"var(--sand-300)",fontSize:12,cursor:"pointer",padding:0,textDecoration:"underline" };

/* ================= Verify email ================= */

  const [busy,setBusy] = useState(false);

  return (

        <p style={{color:"var(--sand-300)",fontSize:12.5,marginBottom:16}}>Check spam if it hasn't arrived in a minute.</p>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>window.location.reload()} className="u" style={{...btn.amber,flex:1,justifyContent:"center"}}>I've verified</button>
          <button onClick={resend} disabled={busy||sent} className="u" style={{...btn.outlineDark,flex:1,justifyContent:"center",opacity:(busy||sent)?.6:1}}>

/* ================= Main ================= */
function Studio({ me }){
  const [stage,setStage] = useState("library");
  const [proj,setProj] = useState({ name:"", desc:"", cat:"Pricing" });
  const [apiKey,setApiKey] = useState(()=>{ try{ return store.get(LS_KEY)||""; }catch{ return ""; } });
  const [keyState,setKeyState] = useState("idle");
  const [keyMsg,setKeyMsg] = useState("");
  const [steps,setSteps] = useState([]);
  const [scripts,setScripts] = useState({});
  const [details,setDetails] = useState({});
  const [voice,setVoice] = useState("Danielle");
  const [guideId,setGuideId] = useState(null);
  const [watching,setWatching] = useState(null);
  const [genErr,setGenErr] = useState("");
  const [busy,setBusy] = useState(false);
  const [toast,setToast] = useState(null);
  const [guides,setGuides] = useState([]);
  const [loadingLib,setLoadingLib] = useState(true);
  const [recUrl,setRecUrl] = useState(null);
  const [recBlob,setRecBlob] = useState(null);
  const [dur,setDur] = useState(0);
  const [marks,setMarks] = useState([]);
  const [analyzeMsg,setAnalyzeMsg] = useState("");
  const [analyzePct,setAnalyzePct] = useState(0);
  const [analyzeErr,setAnalyzeErr] = useState("");
  const recRef = useRef(null), streamRef = useRef(null), chunksRef = useRef([]);

  const showToast = (m)=>{ setToast(m); setTimeout(()=>setToast(null),3200); };
  useEffect(()=>{ try{ apiKey ? store.set(LS_KEY,apiKey) : store.del(LS_KEY); }catch{} },[apiKey]);

  useEffect(()=>{
    if(FB_ON && db){
      const unsub = db.collection("guides").orderBy("updated","desc").onSnapshot(
        snap=>{ setGuides(snap.docs.map(d=>({ id:d.id, ...d.data() }))); setLoadingLib(false); },
        ()=>{ setGuides(loadLocal()); setLoadingLib(false); }
      );
      return ()=>unsub();
    } else { setGuides(loadLocal()); setLoadingLib(false); }
  },[]);
  useEffect(()=>{ if(!FB_ON) saveLocal(guides); },[guides]);

  /* A shared link looks like ...?g=<guideId>. Once the library has loaded,
     open that guide. Runs once, and clears the parameter so a refresh does
     not reopen it unexpectedly. */
  const deepLinkDone = useRef(false);
  useEffect(()=>{
    if(deepLinkDone.current || loadingLib) return;
    let want = null;
    try{ want = new URLSearchParams(location.search).get("g"); }catch{}
    if(!want) { deepLinkDone.current = true; return; }
    deepLinkDone.current = true;
    const g = guides.find(x=>x.id===want);
    if(g){ setWatching(g); }
    else { showToast("That guide could not be found. It may have been removed."); }
    try{ history.replaceState({}, "", location.origin+location.pathname); }catch{}
  },[loadingLib, guides]);

  /* ---------- ENGINE (proxy-routed) ---------- */
  const testKey = async ()=>{
    setKeyState("testing"); setKeyMsg("");
    try{
      const r = await callClaude({ model:MODEL, max_tokens:8, messages:[{role:"user",content:"ping"}] });
      if(r.ok){ setKeyState("valid"); setKeyMsg("Connected and ready. Nothing to set up on your end."); return; }
      const e = await r.json().catch(()=>({}));
      setKeyState("invalid");
      setKeyMsg(r.status===401 ? "Connection was refused (an access setting needs a look)."
        : r.status===429 ? "Busy right now. Try again in a moment."
        : `Couldn't connect (${r.status}). ${e?.error?.message||""}`);
    }catch{
      setKeyState("invalid");
      setKeyMsg("Couldn't reach the service. Make sure you're online and try again."); /* dev note: check PROXY_URL + Worker deploy */
    }
  };

  const startRec = async ()=>{
    try{
      const stream = await navigator.mediaDevices.getDisplayMedia({ video:{ mediaSource:"screen" }, audio:false });
      streamRef.current = stream;
      chunksRef.current = []; setMarks([]);
      const mr = new MediaRecorder(stream); recRef.current = mr;
      mr.ondataavailable = (e)=>{ if(e.data && e.data.size) chunksRef.current.push(e.data); };
      mr.onstop = async ()=>{
        const blob = new Blob(chunksRef.current, { type: mr.mimeType || "video/webm" });
        const url = URL.createObjectURL(blob);
        setRecBlob(blob); setRecUrl(url);
        setStage("analyzing");
        analyzeRecording(url);
      };
      stream.getVideoTracks()[0].addEventListener("ended", ()=>{ if(recRef.current?.state==="recording") stopRec(); });
      mr.start(); setStage("recording");
    }catch{ showToast("Screen sharing was blocked. Allow it and try again."); }
  };
  const stopRec = ()=>{
    if(recRef.current && recRef.current.state!=="inactive") recRef.current.stop();
    streamRef.current?.getTracks().forEach(t=>t.stop());
  };

  const loadVideo = (url)=> new Promise((res,rej)=>{
    const v=document.createElement("video"); v.muted=true; v.playsInline=true; v.preload="auto"; v.src=url;
    v.onerror=()=>rej(new Error("Couldn't load the recording."));
    v.onloadedmetadata=()=>{
      if(v.duration===Infinity || isNaN(v.duration)){
        v.currentTime=24*3600;
        v.ontimeupdate=()=>{ v.ontimeupdate=null; v.currentTime=0; res(v); };
      } else res(v);
    };
  });
  const captureAt = (v,t,w,q)=> new Promise((res)=>{
    const on=()=>{ v.removeEventListener("seeked",on);
      const scale=w/(v.videoWidth||w), h=Math.round((v.videoHeight||w)*scale);
      const c=document.createElement("canvas"); c.width=w; c.height=h||Math.round(w*0.56);
      try{ c.getContext("2d").drawImage(v,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",q)); }
      catch{ res(""); }
    };
    v.addEventListener("seeked",on);
    v.currentTime=Math.max(0, Math.min(t, (v.duration||t)-0.05));
  });

  const visionSteps = async (frames, times, D)=>{
    const content = frames.map(f=>({ type:"image", source:{ type:"base64", media_type:"image/jpeg", data:f.split(",")[1] } }));
    const markHint = marks.length ? `\n\nThe author marked likely step boundaries at these times (seconds): ${marks.map(m=>m.toFixed(1)).join(", ")}. Prefer these as boundaries.` : "";
    content.push({ type:"text", text:
`These ${frames.length} still frames are sampled from a ${Math.round(D)}-second screen recording of a software workflow. Frame times in seconds: ${times.map(t=>t.toFixed(1)).join(", ")}.${markHint}

Identify the MACRO steps, one per distinct screen or task, NOT one per click. For each step give a "start" time in seconds (use the frame times) and a short imperative "title" (max 6 words).

Return ONLY a JSON array, 3 to 8 items, sorted by start, like:
[{"start":0,"title":"Open the loan application"},{"start":12.5,"title":"Enter borrower information"}]` });
    const r = await callClaude({ model:MODEL, max_tokens:700, messages:[{ role:"user", content }] });
    if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e?.error?.message || `Vision request failed (${r.status})`); }
    const data = await r.json();
    const txt = data.content?.[0]?.text || "";
    let arr; try{ arr=JSON.parse(txt); }catch{ const m=txt.match(/\[[\s\S]*\]/); if(!m) throw new Error("Model didn't return step data."); arr=JSON.parse(m[0]); }
    arr = arr.filter(s=>typeof s.start==="number").map(s=>({ start:Math.max(0,Math.min(s.start,D)), title:(s.title||"Step").slice(0,60) })).sort((a,b)=>a.start-b.start);
    const out=[]; for(const s of arr){ if(!out.length || s.start-out[out.length-1].start>1.2) out.push(s); }
    if(!out.length) throw new Error("No steps detected.");
    return out;
  };

  const analyzeRecording = async (url)=>{
    setAnalyzeErr(""); setAnalyzePct(0);
    try{
      setAnalyzeMsg("Loading your recording…"); setAnalyzePct(10);
      const v = await loadVideo(url);
      const D = v.duration || 1; setDur(D);
      const N = Math.max(6, Math.min(12, Math.round(D/4)));
      const times = Array.from({length:N},(_,i)=> +(0.4 + i*(Math.max(D-0.8,0.4))/(N-1||1)).toFixed(2));
      setAnalyzeMsg("Sampling frames from the recording…"); setAnalyzePct(35);
      const small=[]; for(const t of times){ small.push(await captureAt(v,t,480,0.5)); }
      setAnalyzeMsg("Asking Claude to find the steps…"); setAnalyzePct(60);
      const proposed = await visionSteps(small, times, D);
      setAnalyzeMsg("Grabbing a screenshot for each step…"); setAnalyzePct(85);
      const withThumbs=[];
      for(let i=0;i<proposed.length;i++){
        const thumb = await captureAt(v, Math.min(proposed[i].start+0.25, D-0.1), 1100, 0.72);
        withThumbs.push({ id:i+1, title:proposed[i].title, t:proposed[i].start, thumb, conf:0.9 });
      }
      setAnalyzePct(100);
      setSteps(withThumbs); setStage("steps");
    }catch(err){
      setAnalyzeErr(err.message || "Auto-detection needed a hand. Here's an even split you can shape.");
      try{
        const v = await loadVideo(url); const D=v.duration||1; setDur(D);
        const k=4, out=[];
        for(let i=0;i<k;i++){ const t=+(i*D/k).toFixed(2); out.push({ id:i+1, title:`Step ${i+1}`, t, thumb:await captureAt(v,Math.min(t+0.2,D-0.1),1100,0.72), conf:1 }); }
        setSteps(out);
      }catch{ setSteps([]); }
      setStage("steps");
    }
  };

  const genScripts = async ()=>{
    setBusy(true); setGenErr("");
    const list = steps.map((s,i)=>`${i+1}. ${s.title}`).join("\n");
    const prompt = `You write training narration for Partners Mortgage, for an internal audience. Voice: active verbs, plain language (no jargon), direct "you" statements, short sentences. A little warmer and more human than the marketing site, but never jokey about compliance.

Write one line of narration (1-2 sentences) for each step below. Return ONLY raw JSON, no markdown fences, keyed by step number:
{"1":"...","2":"..."}

Steps:
${list}`;
    try{
      const r = await callClaude({ model:MODEL, max_tokens:1000, messages:[{role:"user",content:prompt}] });
      if(!r.ok){
        const e = await r.json().catch(()=>({}));
        throw new Error(r.status===401 ? "Proxy rejected the request (gate PIN or Worker key issue)."
          : r.status===429 ? "Rate limited (429). Wait a moment and retry."
          : `Request failed (${r.status}). ${e?.error?.message||""}`);
      }
      const data = await r.json();
      const txt = data.content?.[0]?.text || "";
      let parsed;
      try{ parsed = JSON.parse(txt); }
      catch{ const m = txt.match(/\{[\s\S]*\}/); if(!m) throw new Error("Response wasn't valid JSON."); parsed = JSON.parse(m[0]); }
      setScripts(parsed); setStage("editing");
    }catch(err){ setGenErr(err.message || "Something went wrong generating scripts."); }
    finally{ setBusy(false); }
  };

  const goGenerate = ()=>{ setStage("generating"); setTimeout(()=>setStage("preview"),2500); };
  const expandDetail = async (step)=>{
    const narration = scripts[step.id]??scripts[String(step.id)]??"";
    const content = [];
    if(step.thumb) content.push({ type:"image", source:{ type:"base64", media_type:"image/jpeg", data:step.thumb.split(",")[1] } });
    content.push({ type:"text", text:
`This is one step in a written training guide for Partners Mortgage (internal audience). Voice: plain, direct, warm, no jargon, no fluff.

Step title: "${step.title}"
Short narration (for the video): "${narration}"

Write a fuller written explanation for the PDF version of this step: 2 to 4 sentences that add the useful detail a spoken line skips (what to watch for, why it matters, a gotcha or tip). Do not repeat the title. Return ONLY the paragraph text, no preamble, no markdown.` });
    const r = await callClaude({ model:MODEL, max_tokens:400, messages:[{ role:"user", content }] });
    if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e?.error?.message || `Expand failed (${r.status})`); }
    const data = await r.json();
    return (data.content?.[0]?.text || "").trim();
  };
  const newGuide = ()=>{ if(!(me&&me.admin)){ showToast("Recording is limited to training admins."); return; } setProj({name:"",desc:"",cat:"Pricing"}); setSteps([]); setScripts({}); setDetails({}); setGenErr("");
    setRecUrl(null); setRecBlob(null); setDur(0); setMarks([]); setAnalyzeErr(""); setStage("setup"); };

  const saveToLibrary = async ()=>{
    const cover = steps.find(s=>s.thumb)?.thumb || "";
    /* Store the written steps as text so a guide can be read and watched
       later. Thumbnails are deliberately left out: they are large and would
       risk the document size limit. */
    const guideSteps = steps.map((st,i)=>({
      n:i+1, title:st.title||"",
      narration:scripts[st.id]??scripts[String(st.id)]??"",
      detail:(details&&(details[st.id]??details[String(st.id)]))||""
    }));
    const entry = { name:proj.name||"Untitled guide", desc:proj.desc||"", cat:proj.cat||"Pricing",
      steps:steps.length, mins:Math.max(1,Math.round((dur||steps.length*40)/60)), status:"Published",
      updated:Date.now(), plays:0, pct:0, author:(me&&me.email)||"You", coverFrame:cover,
      videoUrl:"", guideSteps };
    if(FB_ON && db){
      try{
        const ref = await db.collection("guides").add(entry);
        setGuideId(ref.id);
        showToast(`"${entry.name}" published to the library.`);
      }
      catch{ showToast("Couldn't save to the library. Check your access."); }
    } else {
      const lid = "g-"+Date.now();
      setGuideId(lid);
      setGuides([{ id:lid, ...entry }, ...guides]);
      showToast(`"${entry.name}" published (local test mode).`);
    }
  };

  /* Once a video exists, attach it to the saved guide so the library can
     play it. Without this the library has nothing to open. */
  const attachVideo = async (url)=>{
    if(!url) return;
    if(FB_ON && db && guideId){
      try{ await db.collection("guides").doc(guideId).update({ videoUrl:url }); }
      catch{ showToast("Video is ready, but saving the link to the library failed."); }
    } else if(guideId){
      setGuides(gs=>gs.map(g=>g.id===guideId?{...g,videoUrl:url}:g));
    }
  };
  const deleteGuide = async (id)=>{
    if(FB_ON && db){ try{ await db.collection("guides").doc(id).delete(); }catch{ showToast("Delete failed. Check rules."); } }
    else setGuides(guides.filter(g=>g.id!==id));
  };

  const FLOW = ["Set up","Record","Steps","Script","Publish"];
  const stageIndex = { setup:0, recording:1, analyzing:2, steps:2, editing:3, generating:4, preview:4 }[stage];
  const inFlow = ["setup","recording","analyzing","steps","editing","generating","preview"].includes(stage);

  return (
    <div style={{minHeight:"100%",display:"flex",flexDirection:"column"}}>
      <Header stage={stage} setStage={setStage} onRecord={newGuide} me={me}/>
      {inFlow && <FlowStrip steps={FLOW} active={stageIndex} onExit={()=>setStage("library")}/>}

      {stage==="library" && <Library {...{guides,loadingLib,onNew:newGuide,onDelete:deleteGuide,setStage,me,onWatch:setWatching,onShared:()=>showToast("Share link copied.")}}/>}
      {stage==="learn" && <Learn guides={guides}/>}
      {stage==="settings" && <SettingsScreen {...{apiKey,setApiKey,keyState,setKeyState,keyMsg,testKey}}/>}

      {inFlow && (
        <main style={{flex:1,width:"100%",maxWidth:1120,margin:"0 auto",padding:"32px 28px 90px"}} key={stage}>
          {stage==="setup" && <Setup {...{proj,setProj,onNext:startRec}}/>}
          {stage==="recording" && <RecordStudio {...{onStop:stopRec,marks,setMarks}}/>}
          {stage==="analyzing" && <Analyzing msg={analyzeMsg} pct={analyzePct}/>}
          {stage==="steps" && <Steps {...{steps,setSteps,busy,recUrl,dur,analyzeErr,onGen:genScripts,onBack:()=>setStage("setup")}}/>}
          {stage==="editing" && <Editing {...{steps,scripts,setScripts,details,setDetails,expandDetail,genErr,onNext:goGenerate,onBack:()=>setStage("steps")}}/>}
          {stage==="generating" && <Generating/>}
          {stage==="preview" && <Published {...{proj,steps,scripts,details,voice,setVoice,recUrl,recBlob,dur,guides,showToast,onSave:saveToLibrary,onVideoReady:attachVideo,guideId,onDone:()=>setStage("library")}}/>}
        </main>
      )}
      {watching && <Watch guide={watching} onClose={()=>setWatching(null)}/>}
      {toast && <Toast msg={toast}/>}
      <style>{`
        @media(max-width:860px){
          .hero-grid{grid-template-columns:1fr!important}
          .feature{grid-template-columns:1fr!important}
          .pub-grid{grid-template-columns:1fr!important}
          .flow-nodes{display:none!important}
          .flow-mini{display:flex!important}
          .nav-links{display:none!important}
        }
      `}</style>
    </div>
  );
}

/* ================= Header ================= */

        ))}
      </nav>
      <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:16}}>
        <span style={{fontFamily:"var(--font-script)",fontStyle:"italic",fontSize:19,color:"var(--teal-500)"}}>You matter.</span>
        {me && me.admin && <button onClick={onRecord} className="u" style={{...btn.primary,padding:"10px 16px",fontSize:12}}><IcRecord size={14}/> Record a guide</button>}
        <span title={(me&&me.email)||""} style={{display:"flex",alignItems:"center",gap:8}}>
          {me && me.admin && <span className="u" style={{fontSize:9,fontWeight:700,letterSpacing:".08em",padding:"3px 7px",borderRadius:100,background:"var(--amber-wash)",color:"var(--amber-600)"}}>ADMIN</span>}
          <span style={{width:34,height:34,borderRadius:"50%",background:"var(--teal-900)",color:"#fff",display:"grid",placeItems:"center",fontFamily:"var(--font-display)",fontWeight:700,fontSize:12}}>

          <button onClick={()=>{ try{ auth.signOut(); }catch{} }} className="u" title="Sign out"
            style={{background:"none",border:"none",color:"var(--sand-500)",fontSize:10,fontWeight:700,letterSpacing:".06em",cursor:"pointer",padding:0}}>Sign out</button>
        </span>

/* ================= Flow strip ================= */
function FlowStrip({ steps, active, onExit }){
  return (
    <div style={{height:62,background:"#fff",borderBottom:"1px solid var(--sand-200)",display:"flex",alignItems:"center",gap:18,padding:"0 24px",position:"sticky",top:64,zIndex:20}}>
      <button onClick={onExit} className="u" style={{display:"inline-flex",alignItems:"center",gap:6,background:"none",border:"none",color:"var(--sand-600)",fontSize:11,fontWeight:700,letterSpacing:".1em",cursor:"pointer"}}>
        <IcArrowL size={15}/> Exit
      </button>
      <div style={{width:1,height:26,background:"var(--sand-200)"}}/>
      <div className="flow-nodes" style={{display:"flex",alignItems:"center",gap:0,flex:1,maxWidth:640}}>
        {steps.map((s,i)=>{
          const done=i<active, now=i===active;
          return (
            <React.Fragment key={i}>
              <div style={{display:"flex",alignItems:"center",gap:9}}>
                <div style={{width:24,height:24,borderRadius:"50%",display:"grid",placeItems:"center",flexShrink:0,fontFamily:"var(--font-display)",fontWeight:700,fontSize:11,transition:"all .25s",
                  background:done?"var(--teal-500)":now?"#fff":"var(--sand-100)",color:done?"#fff":now?"var(--teal-600)":"var(--sand-500)",
                  border:now?"2px solid var(--teal-500)":"2px solid transparent",boxShadow:now?"0 0 0 4px var(--teal-wash)":"none"}}>
                  {done?<IcCheck size={13} stroke={3}/>:i+1}
                </div>
                <span className="u" style={{fontSize:11,fontWeight:700,letterSpacing:".06em",color:now?"var(--sand-900)":done?"var(--sand-600)":"var(--sand-500)"}}>{s}</span>
              </div>
              {i<steps.length-1 && <div style={{flex:1,height:2,margin:"0 12px",background:done?"var(--teal-500)":"var(--sand-200)",minWidth:16}}/>}
            </React.Fragment>
          );
        })}
      </div>
      <div className="flow-mini" style={{display:"none",alignItems:"center",gap:10,flex:1}}>
        <span className="u" style={{fontSize:12,fontWeight:700,letterSpacing:".06em",color:"var(--sand-900)"}}>Step {active+1} of {steps.length}</span>
        <div style={{flex:1,height:5,borderRadius:5,background:"var(--sand-200)",overflow:"hidden"}}><div style={{width:`${(active+1)/steps.length*100}%`,height:"100%",background:"var(--teal-500)"}}/></div>
      </div>
    </div>
  );
}

/* ================= Cover ================= */
function Cover({ title, status, mins, frame, size="card" }){
  const titleSize = size==="feature"?20:size==="share"?40:15;
  const pad = size==="share"?"0 34px 26px":size==="feature"?"0 22px 18px":"0 16px 14px";
  const hasPhoto = !!frame;
  return (
    <div style={{position:"relative",aspectRatio:"16/9",width:"100%",overflow:"hidden",
      borderRadius:size==="card"?"14px 14px 0 0":14,background:"var(--teal-900)",
      display:"flex",flexDirection:"column",justifyContent:"flex-end"}}>

      {/* the opening frame of the recording */}
      {hasPhoto && <img src={frame} alt="" style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover"}}/>}

      {hasPhoto ? (
        <>
          {/* fade the picture out toward the bottom so the title always reads */}
          <div style={{position:"absolute",inset:0,background:
            "linear-gradient(to bottom, rgba(6,47,52,.10) 0%, rgba(6,47,52,.30) 38%, rgba(6,47,52,.72) 72%, rgba(6,47,52,.94) 100%)"}}/>
          {/* whisper of brand teal over the whole thing */}
          <div style={{position:"absolute",inset:0,background:"rgba(0,129,141,.14)",mixBlendMode:"multiply"}}/>
        </>
      ) : (
        <>
          {/* no frame captured: fall back to the teal roofline treatment */}
          <div style={{position:"absolute",inset:0,background:"linear-gradient(150deg, rgba(0,129,141,.5) 0%, rgba(6,47,52,.15) 60%)"}}/>
          <div style={{position:"absolute",inset:0,backgroundImage:`url("data:image/svg+xml,${ROOF}")`,backgroundSize:"72px 72px"}}/>
        </>
      )}

      <div style={{position:"relative",padding:pad}}>
        <div style={{width:32,height:4,borderRadius:4,background:"var(--amber-500)",marginBottom:size==="share"?16:10}}/>
        <div className="u" style={{fontWeight:900,color:"#fff",fontSize:titleSize,lineHeight:1.12,letterSpacing:".01em",
          textShadow:hasPhoto?"0 2px 14px rgba(0,0,0,.55)":"none"}}>{title||"UNTITLED GUIDE"}</div>
      </div>

      {status && <span className="u" style={{position:"absolute",top:12,right:12,fontSize:9.5,fontWeight:800,letterSpacing:".08em",padding:"4px 9px",borderRadius:100,
        background:status==="Published"?"var(--amber-500)":"rgba(255,255,255,.92)",color:status==="Published"?"var(--sand-900)":"var(--sand-800)"}}>{status}</span>}
      {mins!=null && <span className="num" style={{position:"absolute",bottom:12,right:12,fontSize:11,fontWeight:600,padding:"3px 8px",borderRadius:100,background:"rgba(6,47,52,.7)",color:"#fff"}}>{mins} min</span>}
    </div>
  );
}

/* ================= Recording studio ================= */
function RecordStudio({ onStop, marks, setMarks }){
  const [t,setT] = useState(0);
  const startRef = useRef(Date.now());
  useEffect(()=>{ const id=setInterval(()=>setT((Date.now()-startRef.current)/1000),200); return ()=>clearInterval(id); },[]);
  const mark = ()=> setMarks(m=>[...m, +((Date.now()-startRef.current)/1000).toFixed(1)]);
  useEffect(()=>{
    const h=(e)=>{ if(e.key==="m"||e.key==="M"){ e.preventDefault(); mark(); } };
    window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h);
  },[]);
  const mm=String(Math.floor(t/60)).padStart(2,"0"), ss=String(Math.floor(t%60)).padStart(2,"0");
  return (
    <div style={{maxWidth:820,animation:"fadeUp .35s ease"}}>
      <Eyebrow>STEP 2 OF 5</Eyebrow>
      <H2>YOU'RE ON THE AIR</H2>
      <div style={{background:"var(--teal-900)",borderRadius:20,padding:"36px 32px",boxShadow:"var(--shadow-dark)",position:"relative",overflow:"hidden",marginTop:18}}>
        <div style={{position:"absolute",inset:0,backgroundImage:`url("data:image/svg+xml,${ROOF}")`,backgroundSize:"72px 72px",opacity:.4}}/>
        <div style={{position:"relative"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:22}}>
            <span style={{width:11,height:11,borderRadius:"50%",background:"var(--pm-coral)",animation:"pulseDot 1.1s infinite"}}/>
            <span className="u" style={{fontSize:11,fontWeight:800,letterSpacing:".16em",color:"#fff"}}>ON THE AIR</span>
          </div>
          <div className="num" style={{fontSize:76,fontWeight:900,color:"#fff",lineHeight:1,letterSpacing:".02em"}}>{mm}:{ss}</div>
          <div style={{display:"flex",gap:3,alignItems:"flex-end",height:40,margin:"24px 0"}}>
            {Array.from({length:60}).map((_,i)=>{
              const h = 8 + Math.abs(Math.sin((i*0.5)+(t*3)))*30;
              return <span key={i} style={{flex:1,height:h,borderRadius:2,background:"rgba(255,255,255,.28)"}}/>;
            })}
          </div>
          <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
            <button onClick={mark} className="u" style={{...btn.outlineDark,padding:"12px 18px"}}><IcFlag size={16}/> Mark a step <kbd style={{marginLeft:6,fontFamily:"var(--font-display)",fontSize:10,padding:"2px 6px",borderRadius:5,background:"rgba(255,255,255,.16)"}}>M</kbd></button>
            <button onClick={onStop} className="u" style={{...btn.coral,padding:"12px 20px"}}><IcStop size={16}/> Stop & review</button>
          </div>
          {marks.length>0 && (
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:20}}>
              {marks.map((m,i)=>(
                <span key={i} className="num" style={{fontSize:12,color:"#fff",background:"rgba(255,255,255,.1)",border:"1px solid rgba(255,255,255,.16)",borderRadius:100,padding:"5px 11px"}}>
                  <span className="u" style={{fontWeight:700,letterSpacing:".05em",marginRight:6}}>Step {i+2}</span>{fmt(m)}
                </span>
              ))}
            </div>
          )}
        </div>
      </div>
      <p style={{fontSize:13.5,color:"var(--sand-600)",marginTop:16}}>Tap <b>M</b> each time you start a new step. Those marks help Claude cut the steps more accurately, and you can still fix everything on the next screen.</p>
    </div>
  );
}

/* ================= Steps (filmstrip) ================= */
function Steps({ steps,setSteps,busy,recUrl,dur,analyzeErr,onGen,onBack }){
  const [editId,setEditId]=useState(null);
  const [draft,setDraft]=useState("");
  const [dragId,setDragId]=useState(null);
  const [overId,setOverId]=useState(null);
  const [splitId,setSplitId]=useState(null);
  const [splitT,setSplitT]=useState(0);
  const [splitThumb,setSplitThumb]=useState("");
  const vidRef=useRef(null);

  useEffect(()=>{ if(!recUrl) return; const v=document.createElement("video"); v.src=recUrl; v.muted=true; v.playsInline=true; v.preload="auto"; vidRef.current=v; },[recUrl]);
  const capture=(t,w=1100,q=0.72)=> new Promise((res)=>{ const v=vidRef.current; if(!v){res("");return;}
    const on=()=>{ v.removeEventListener("seeked",on); const scale=w/(v.videoWidth||w),h=Math.round((v.videoHeight||w)*scale);
      const c=document.createElement("canvas"); c.width=w; c.height=h||360; try{ c.getContext("2d").drawImage(v,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",q)); }catch{ res(""); } };
    v.addEventListener("seeked",on); v.currentTime=Math.max(0,Math.min(t,(v.duration||t)-0.05)); });

  const beginEdit=(s)=>{ setEditId(s.id); setDraft(s.title); };
  const commit=()=>{ setSteps(prev=>prev.map(s=>s.id===editId?{...s,title:draft.trim()||s.title}:s)); setEditId(null); };
  const remove=(id)=> setSteps(steps.filter(s=>s.id!==id));
  const onDrop=(targetId)=>{ if(dragId==null||dragId===targetId){ setDragId(null); setOverId(null); return; }
    const arr=[...steps]; const from=arr.findIndex(s=>s.id===dragId), to=arr.findIndex(s=>s.id===targetId);
    const [m]=arr.splice(from,1); arr.splice(to,0,m); setSteps(arr); setDragId(null); setOverId(null); };
  const openSplit=async(s,i)=>{ const next=steps[i+1]; const hi=next?next.t:(dur||s.t+8); const mid=+((s.t+hi)/2).toFixed(1); setSplitId(s.id); setSplitT(mid); setSplitThumb(await capture(mid)); };
  const previewSplit=async(val)=>{ setSplitT(val); setSplitThumb(await capture(val)); };
  const confirmSplit=async()=>{ const i=steps.findIndex(s=>s.id===splitId); const thumb=splitThumb||await capture(splitT);
    const ns={ id:Math.max(0,...steps.map(s=>s.id))+1, title:"New step", t:splitT, thumb, conf:1 };
    const arr=[...steps]; arr.splice(i+1,0,ns); setSteps(arr); setSplitId(null); setSplitThumb(""); setEditId(ns.id); setDraft("New step"); };

  return (
    <div style={{animation:"fadeUp .35s ease"}}>
      <Eyebrow>STEP 3 OF 5</Eyebrow>
      <H2>CONFIRM YOUR STEPS</H2>
      <p style={{fontSize:15,color:"var(--sand-600)",marginTop:8,marginBottom:analyzeErr?14:22,maxWidth:600}}>Claude proposed {steps.length} steps from your recording. Rename, reorder, split, or delete until it reads right.</p>
      {analyzeErr && <div style={{display:"flex",gap:10,padding:"12px 14px",borderRadius:11,marginBottom:20,background:"var(--amber-wash)",color:"#9a6b1e",fontSize:13.5,alignItems:"flex-start"}}><span style={{marginTop:1}}><IcFlag size={16}/></span><span>{analyzeErr}</span></div>}

      <div style={{display:"flex",gap:14,overflowX:"auto",paddingBottom:14}}>
        {steps.map((s,i)=>{
          const over=overId===s.id&&dragId!==s.id, dragging=dragId===s.id;
          return (
            <div key={s.id} draggable={editId!==s.id}
              onDragStart={()=>setDragId(s.id)} onDragEnd={()=>{setDragId(null);setOverId(null);}}
              onDragOver={e=>{e.preventDefault();setOverId(s.id);}} onDrop={()=>onDrop(s.id)}
              style={{width:232,flexShrink:0,background:"#fff",border:`1px solid ${over?"var(--teal-500)":"var(--sand-200)"}`,borderRadius:14,overflow:"hidden",boxShadow:over?"0 0 0 3px var(--teal-wash)":"var(--shadow-card)",opacity:dragging?.4:1,transition:"all .15s"}}>
              <div style={{position:"relative",aspectRatio:"16/10",background:"var(--teal-900)"}}>
                {s.thumb && <img src={s.thumb} alt={`Step ${i+1}: ${s.title}`} style={{width:"100%",height:"100%",objectFit:"cover"}}/>}
                <span className="num" style={{position:"absolute",top:8,left:8,fontSize:22,fontWeight:900,color:"rgba(255,255,255,.85)",textShadow:"0 1px 6px rgba(0,0,0,.4)"}}>{String(i+1).padStart(2,"0")}</span>
                <span className="num" style={{position:"absolute",bottom:8,right:8,fontSize:11,color:"#fff",background:"rgba(6,47,52,.72)",borderRadius:100,padding:"2px 7px"}}>{fmt(s.t)}</span>
                <span style={{position:"absolute",top:8,right:8,color:"rgba(255,255,255,.7)",cursor:"grab"}}><IcGrip size={16}/></span>
              </div>
              <div style={{padding:"10px 11px 11px"}}>
                {editId===s.id ? (
                  <input autoFocus value={draft} onChange={e=>setDraft(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape")setEditId(null);}} onBlur={commit}
                    className="u" style={{...inp,padding:"6px 8px",fontSize:12,fontWeight:700,letterSpacing:".03em"}}/>
                ) : (
                  <div className="u" onClick={()=>beginEdit(s)} title="Click to rename" style={{fontWeight:700,fontSize:12,letterSpacing:".03em",color:"var(--sand-900)",lineHeight:1.3,minHeight:31,cursor:"text"}}>{s.title}</div>
                )}
                <div style={{display:"flex",gap:5,marginTop:9}}>
                  <button onClick={()=>beginEdit(s)} style={iconBtnSm()} title="Rename"><IcEdit size={14}/></button>
                  {recUrl && <button onClick={()=>openSplit(s,i)} style={iconBtnSm()} title="Split"><IcScissors size={14}/></button>}
                  <button onClick={()=>remove(s.id)} style={iconBtnSm(true)} title="Delete"><IcTrash size={14}/></button>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {dur>0 && (
        <div style={{position:"relative",height:34,margin:"10px 2px 0",borderTop:"2px solid var(--sand-200)"}}>
          {steps.map((s)=>(
            <div key={s.id} style={{position:"absolute",top:-2,left:`${Math.min(100,(s.t/dur)*100)}%`}}>
              <div style={{width:2,height:12,background:"var(--teal-500)"}}/>
              <div className="num" style={{fontSize:10,color:"var(--sand-500)",marginTop:2,transform:"translateX(-50%)"}}>{fmt(s.t)}</div>
            </div>
          ))}
        </div>
      )}

      {splitId!=null && (()=>{ const i=steps.findIndex(s=>s.id===splitId); const s=steps[i]; const hi=steps[i+1]?steps[i+1].t:(dur||s.t+8);
        return (
          <div style={{border:"1px solid var(--teal-500)",borderRadius:14,background:"var(--teal-wash)",padding:"16px 18px",marginTop:18,maxWidth:520}}>
            <div className="u" style={{fontSize:12,fontWeight:700,letterSpacing:".06em",color:"var(--teal-600)",marginBottom:12}}>PICK WHERE THE NEW STEP BEGINS</div>
            <div style={{display:"flex",gap:14,alignItems:"center"}}>
              <div style={{width:150,height:86,borderRadius:8,overflow:"hidden",flexShrink:0,border:"1px solid var(--sand-200)",background:"var(--teal-900)"}}>{splitThumb && <img src={splitThumb} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>}</div>
              <div style={{flex:1}}>
                <input type="range" min={s.t} max={hi} step="0.5" value={splitT} onChange={e=>previewSplit(parseFloat(e.target.value))} style={{width:"100%",accentColor:"var(--teal-500)"}}/>
                <div className="num" style={{fontSize:12,color:"var(--sand-600)",marginTop:4}}>New step at {fmt(splitT)}</div>
                <div style={{display:"flex",gap:8,marginTop:10}}>
                  <button onClick={confirmSplit} className="u" style={{...btn.primary,padding:"8px 14px",fontSize:11}}>Split here</button>
                  <button onClick={()=>{setSplitId(null);setSplitThumb("");}} className="u" style={{...btn.ghost,padding:"8px 14px",fontSize:11}}>Cancel</button>
                </div>
              </div>
            </div>
          </div>
        ); })()}

      <div style={{display:"flex",gap:12,marginTop:30,flexWrap:"wrap"}}>
        <button onClick={onGen} disabled={!steps.length||busy} className="u" style={{...btn.primary,opacity:steps.length&&!busy?1:.5}}>
          {busy?<><Spinner/> Writing…</>:<><IcSpark size={16}/> Write the narration</>}
        </button>
        <button onClick={onBack} className="u" style={btn.ghost}><IcArrowL size={15}/> Back</button>
      </div>
    </div>
  );
}

  const [done,setDone]=useState(0);
  useEffect(()=>{ const id=setInterval(()=>setDone(d=>Math.min(d+1,items.length)),620); return ()=>clearInterval(id); },[]);
  return (

        {items.map((it,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:12,padding:14,borderBottom:i<items.length-1?"1px solid var(--sand-100)":"none"}}>

}

/* ================= Published (reward) ================= */
function Published({ proj,steps,scripts,details,voice,setVoice,recUrl,recBlob,dur,guides,showToast,onSave,onVideoReady,guideId,onDone }){
  const [saved,setSaved]=useState(false);
  const [copied,setCopied]=useState(false);
  const [vidState,setVidState]=useState("idle"); // idle | rendering | done | error
  const [vidUrl,setVidUrl]=useState("");
  const [vidMsg,setVidMsg]=useState("");
  useEffect(()=>{ if(!saved){ onSave(); setSaved(true); } },[]);
  const mins=Math.max(1,Math.round((dur||steps.length*40)/60));
  const myCount=(guides.filter(g=>g.author==="You").length)+1;
  const downloadRaw=()=>{ if(!recBlob)return; const a=document.createElement("a"); a.href=URL.createObjectURL(recBlob); a.download=`${(proj.name||"recording").replace(/[^a-z0-9-_]+/gi,"-").toLowerCase()}.webm`; a.click(); };
  /* A real link back into this app, pointing at this guide. Recipients sign
     in with their Partners account and land on the guide. */
  const shareLink = guideId
    ? `${location.origin}${location.pathname}?g=${encodeURIComponent(guideId)}`
    : "";
  const copyLink=async()=>{
    if(!shareLink){ showToast("The link appears once the guide is saved."); return; }
    try{ await navigator.clipboard.writeText(shareLink); }
    catch{
      // clipboard can be blocked; fall back to selecting the field
      const el=document.getElementById("wf-share-input");
      if(el){ el.removeAttribute("readonly"); el.select(); document.execCommand&&document.execCommand("copy"); el.setAttribute("readonly","readonly"); }
    }
    setCopied(true); setTimeout(()=>setCopied(false),2000);
  };
  const makePDF=()=>{
    try{
      const JS = window.jspdf && window.jspdf.jsPDF;
      if(!JS){ showToast("PDF library still loading, try again in a second."); return; }
      const doc = new JS({ unit:"pt", format:"letter" });
      const W=612, H=792, M=56, CONTENT=W-M*2;
      const TEAL=[0,110,120], DEEP=[6,47,52], AMBER=[255,172,39];
      const INK=[36,31,29], SOFT=[95,88,84], LINE=[228,223,218];

      /* ---------- cover ---------- */
      doc.setFillColor(DEEP[0],DEEP[1],DEEP[2]); doc.rect(0,0,W,H,"F");
      doc.setFillColor(AMBER[0],AMBER[1],AMBER[2]); doc.rect(M,300,48,6,"F");
      doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.setFontSize(34);
      let ty=348;
      doc.splitTextToSize((proj.name||"Training Guide").toUpperCase(), CONTENT).forEach(l=>{ doc.text(l,M,ty); ty+=40; });
      if(proj.desc){
        doc.setFont("helvetica","normal"); doc.setFontSize(13); doc.setTextColor(205,214,213);
        doc.text(doc.splitTextToSize(proj.desc, CONTENT-40), M, ty+6);
      }
      doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(150,168,168);
      doc.text("WAYFINDER   \u00b7   A PARTNERS MORTGAGE TOOL", M, H-90);
      doc.setFont("helvetica","italic"); doc.setFontSize(12);
      doc.setTextColor(AMBER[0],AMBER[1],AMBER[2]);
      doc.text("You matter.", M, H-66);

      /* ---------- steps ---------- */
      const IMG_W=372, pageTop=72, pageBottom=H-64;
      let page=1;
      doc.addPage(); page++;
      let y=pageTop;
      const footer=()=>{
        doc.setFont("helvetica","normal"); doc.setFontSize(8.5); doc.setTextColor(165,158,152);
        doc.text("WAYFINDER  \u00b7  "+(proj.name||"Training guide"), M, H-40);
        doc.text(String(page-1), W-M, H-40, { align:"right" });
      };
      footer();

      steps.forEach((s,i)=>{
        const detail=(details&&(details[s.id]??details[String(s.id)]))||"";
        const narr=scripts[s.id]??scripts[String(s.id)]??"";
        const body=(detail.trim()||narr||"").trim();

        const imgH = s.thumb ? Math.round(IMG_W*0.625) : 0;
        doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
        const lines = doc.splitTextToSize(body||" ", CONTENT);
        const blockH = 26 + (imgH?imgH+14:0) + lines.length*14.5 + 30;
        if(y+blockH > pageBottom){ doc.addPage(); page++; y=pageTop; footer(); }

        doc.setFillColor(230,242,243); doc.circle(M+10,y+2,11,"F");
        doc.setFont("helvetica","bold"); doc.setFontSize(11);
        doc.setTextColor(TEAL[0],TEAL[1],TEAL[2]);
        doc.text(String(i+1), M+10, y+6, { align:"center" });

        doc.setFont("helvetica","bold"); doc.setFontSize(13.5);
        doc.setTextColor(INK[0],INK[1],INK[2]);
        let tyy=y+7;
        doc.splitTextToSize(s.title||"", CONTENT-34).forEach(l=>{ doc.text(l,M+30,tyy); tyy+=17; });
        let cursor=Math.max(y+26, tyy+4);

        if(s.thumb){
          try{
            doc.addImage(s.thumb,"JPEG",M+30,cursor,IMG_W,imgH);
            doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.setLineWidth(0.7);
            doc.rect(M+30,cursor,IMG_W,imgH);
          }catch(e){}
          cursor += imgH+14;
        }

        doc.setFont("helvetica","normal"); doc.setFontSize(10.5);
        doc.setTextColor(SOFT[0],SOFT[1],SOFT[2]);
        lines.forEach(l=>{ doc.text(l,M+30,cursor+3); cursor+=14.5; });

        y = cursor+16;
        if(i<steps.length-1){
          doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.setLineWidth(0.8);
          doc.line(M,y,W-M,y); y+=22;
        }
      });

      doc.save(`${(proj.name||"wayfinder-guide").replace(/[^a-z0-9-_]+/gi,"-").toLowerCase()}.pdf`);
    }catch(err){ showToast("PDF build hit a snag: "+(err.message||err)); }
  };
  const [showRaw,setShowRaw]=useState(false);
  const [vidPhase,setVidPhase]=useState("");   // "uploading" | "rendering"
  const [vidPct,setVidPct]=useState(0);
  const timers=useRef([]);
  const phaseRef=useRef("waking");
  const clearTimers=()=>{ timers.current.forEach(clearTimeout); timers.current=[]; };
  useEffect(()=>()=>clearTimers(),[]);
  const makeVideo=async()=>{
    if(!PROXY){ showToast("Video service isn't configured yet."); return; }
    clearTimers();
    setVidState("rendering"); setVidPhase("uploading"); setVidPct(2);
    setVidMsg("Uploading your recording. This uses your real screen capture, so give it a moment.");
    try{
      /* 1. Upload the actual recording so the renderer can use the real
            footage. Ask the service for a one-time upload address, then
            send the file straight to storage (no proxy hop for the video). */
      let videoUrl = "";
      if(recBlob){
        const ur = await callUploadUrl({ name: proj.name||"recording", content_type: recBlob.type||"video/webm" });
        const ud = await ur.json().catch(()=>({}));
        if(!ur.ok || !ud.put_url) throw new Error(ud.detail||ud.error||"Couldn't start the upload.");
        const put = await fetch(ud.put_url, {
          method:"PUT",
          headers:{ "Content-Type": recBlob.type||"video/webm" },
          body: recBlob
        });
        if(!put.ok) throw new Error("Upload failed ("+put.status+"). If this keeps happening, storage may need a CORS rule for this site.");
        videoUrl = ud.video_url || "";
      }

      /* 2. Start the render job. Returns immediately with a job id. */
      setVidPhase("rendering"); setVidPct(8); setVidMsg("Building your narrated video.");
      const payload = {
        title: proj.name||"Wayfinder guide",
        voice: voice,
        video_url: videoUrl,
        steps: steps.map((s,i)=>({
          n: i+1,
          title: s.title,
          narration: scripts[s.id]??scripts[String(s.id)]??s.title,
          t: Number(s.t)||0
        }))
      };
      const r = await callRender(payload);
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.detail||d.error||("Render failed ("+r.status+")"));
      if(!d.job_id) throw new Error("The service didn't return a job id.");

      /* 3. Poll until it's ready. Progress comes from the service, so the
            bar reflects real work instead of guessing. */
      const started = Date.now();
      const poll = async ()=>{
        if(Date.now()-started > 15*60*1000){
          setVidState("error"); setVidMsg("This is taking unusually long. Try again."); return;
        }
        let j = null;
        try{
          const jr = await getProxy("/job/"+d.job_id);
          j = await jr.json().catch(()=>null);
          if(jr.status===404){ throw new Error("The job expired. Please try again."); }
        }catch(e){
          // transient network hiccup: keep waiting rather than failing
          timers.current.push(setTimeout(poll, 4000)); return;
        }
        if(!j){ timers.current.push(setTimeout(poll, 4000)); return; }

        if(typeof j.pct === "number") setVidPct(Math.max(2, Math.min(99, j.pct)));
        if(j.message) setVidMsg(j.message);
        if(j.phase) setVidPhase(j.phase==="uploading"?"uploading":"rendering");

        if(j.status === "done" && j.url){
          clearTimers(); setVidPct(100); setVidUrl(j.url);
          setVidState("done"); setVidPhase(""); setVidMsg("");
          try{ onVideoReady && onVideoReady(j.url); }catch{}
          return;
        }
        if(j.status === "error"){
          clearTimers(); setVidState("error"); setVidPhase(""); setVidPct(0);
          setVidMsg(j.error || "Render failed."); return;
        }
        timers.current.push(setTimeout(poll, 3000));
      };
      timers.current.push(setTimeout(poll, 2500));

    }catch(err){ clearTimers(); setVidState("error"); setVidPhase(""); setVidPct(0); setVidMsg(String(err.message||err)); }
  };

  return (

            <div style={{display:"flex",gap:26}}>

/* ================= Watch a guide ================= */
function Watch({ guide, onClose }){
  const steps = Array.isArray(guide.guideSteps) ? guide.guideSteps : [];
  const hasVideo = !!guide.videoUrl;
  useEffect(()=>{
    const h=(e)=>{ if(e.key==="Escape") onClose(); };
    window.addEventListener("keydown",h);
    document.body.style.overflow="hidden";
    return ()=>{ window.removeEventListener("keydown",h); document.body.style.overflow=""; };
  },[]);
  return (
    <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:80,background:"rgba(6,47,52,.72)",
      backdropFilter:"blur(3px)",display:"flex",alignItems:"flex-start",justifyContent:"center",
      padding:"40px 20px",overflowY:"auto"}}>
      <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:900,background:"#fff",
        borderRadius:18,overflow:"hidden",boxShadow:"0 30px 80px rgba(6,47,52,.4)",animation:"fadeUp .28s ease"}}>

        {/* header */}
        <div style={{background:"var(--teal-900)",padding:"20px 24px",position:"relative"}}>
          <div style={{position:"absolute",inset:0,backgroundImage:`url("data:image/svg+xml,${ROOF}")`,backgroundSize:"72px 72px",opacity:.4}}/>
          <div style={{position:"relative",display:"flex",alignItems:"flex-start",gap:16}}>
            <div style={{flex:1}}>
              <div style={{width:32,height:4,borderRadius:4,background:"var(--amber-500)",marginBottom:10}}/>
              <div className="u" style={{fontWeight:900,fontSize:22,letterSpacing:".01em",color:"#fff",lineHeight:1.15}}>{guide.name}</div>
              {guide.desc && <p style={{fontSize:14,color:"var(--sand-300)",marginTop:8,maxWidth:560}}>{guide.desc}</p>}
              <div style={{display:"flex",gap:16,marginTop:12,fontSize:12,color:"var(--sand-300)"}}>
                <span className="num">{guide.steps||steps.length} steps</span>
                {guide.mins!=null && <span className="num">{guide.mins} min</span>}
                {guide.author && <span>{guide.author}</span>}
              </div>
            </div>
            <button onClick={onClose} title="Close" style={{background:"rgba(255,255,255,.12)",border:"none",
              color:"#fff",width:34,height:34,borderRadius:9,cursor:"pointer",display:"grid",placeItems:"center",flexShrink:0}}>
              <IcX size={17}/>
            </button>
          </div>
        </div>

        {/* video */}
        {hasVideo ? (
          <video src={guide.videoUrl} controls autoPlay playsInline preload="metadata"
            style={{width:"100%",display:"block",aspectRatio:"16/9",background:"var(--teal-900)"}}/>
        ) : (
          <div style={{padding:"26px 24px",background:"var(--amber-wash)",borderBottom:"1px solid var(--sand-200)",
            display:"flex",gap:12,alignItems:"flex-start"}}>
            <span style={{color:"var(--amber-600)",marginTop:1}}><IcVideo size={18}/></span>
            <div>
              <div className="u" style={{fontWeight:700,fontSize:12.5,letterSpacing:".04em",color:"#9a6b1e"}}>NO VIDEO YET</div>
              <div style={{fontSize:13.5,color:"#9a6b1e",marginTop:4}}>
                The written steps are below. A narrated video can be made from the publish screen when this guide is recorded again.
              </div>
            </div>
          </div>
        )}

        {/* written steps */}
        <div style={{padding:"18px 24px 26px"}}>
          <div className="u" style={{fontSize:11,fontWeight:700,letterSpacing:".12em",color:"var(--sand-500)",marginBottom:14}}>THE WRITTEN GUIDE</div>
          {steps.length===0 ? (
            <div style={{fontSize:14,color:"var(--sand-500)"}}>No written steps were saved with this guide.</div>
          ) : steps.map((st,i)=>(
            <div key={i} style={{display:"flex",gap:13,padding:"12px 0",borderBottom:i<steps.length-1?"1px solid var(--sand-100)":"none"}}>
              <div className="num" style={{width:24,height:24,borderRadius:7,flexShrink:0,background:"var(--teal-wash)",
                color:"var(--teal-600)",fontWeight:700,fontSize:12,display:"grid",placeItems:"center"}}>{st.n||i+1}</div>
              <div style={{minWidth:0}}>
                <div className="u" style={{fontWeight:700,fontSize:13,letterSpacing:".02em",color:"var(--sand-900)",marginBottom:3}}>{st.title}</div>
                <div style={{fontSize:14,color:"var(--sand-600)",lineHeight:1.55}}>{st.detail||st.narration}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

}
function Pill({ ok,label }){ return <span className="u" style={{fontSize:10,fontWeight:700,letterSpacing:".06em",padding:"4px 10px",borderRadius:100,background:ok?"var(--pm-green-wash)":"var(--sand-100)",color:ok?"#5a7d0f":"var(--sand-600)"}}>{label}</span>; }
function Spinner({ sm,big }){ const s=big?26:sm?13:16; return <span style={{width:s,height:s,border:`${big?3:2}px solid currentColor`,borderTopColor:"transparent",borderRadius:"50%",display:"inline-block",animation:"spin .7s linear infinite"}}/>; }
function Toast({ msg }){ return <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",zIndex:60,background:"var(--sand-900)",color:"#fff",padding:"12px 18px",borderRadius:11,fontSize:14,boxShadow:"0 8px 30px rgba(0,0,0,.2)",maxWidth:440}}>{msg}</div>; }

const inp={ width:"100%",padding:"11px 13px",fontSize:14.5,fontFamily:"var(--font-body)",color:"var(--sand-900)",background:"#fff",border:"1px solid var(--sand-200)",borderRadius:"var(--radius-input)",outline:"none",transition:"border-color .15s,box-shadow .15s" };
const inpDark={ ...inp,background:"rgba(255,255,255,.06)",color:"#fff",border:"1px solid rgba(255,255,255,.16)" };

const btn={
  primary:{display:"inline-flex",alignItems:"center",justifyContent:"center",gap:8,background:"var(--teal-500)",color:"#fff",border:"none",borderRadius:11,padding:"12px 20px",fontSize:13,fontWeight:700,letterSpacing:".04em",cursor:"pointer",transition:"background .15s"},
  amber:{display:"inline-flex",alignItems:"center",justifyContent:"center",gap:8,background:"var(--amber-500)",color:"var(--sand-900)",border:"none",borderRadius:11,padding:"12px 20px",fontSize:13,fontWeight:800,letterSpacing:".04em",cursor:"pointer"},
  coral:{display:"inline-flex",alignItems:"center",justifyContent:"center",gap:8,background:"var(--pm-coral)",color:"#fff",border:"none",borderRadius:11,padding:"12px 20px",fontSize:13,fontWeight:700,letterSpacing:".04em",cursor:"pointer"},
  ghost:{display:"inline-flex",alignItems:"center",justifyContent:"center",gap:8,background:"#fff",color:"var(--sand-800)",border:"1px solid var(--sand-200)",borderRadius:11,padding:"11px 18px",fontSize:13,fontWeight:700,letterSpacing:".04em",cursor:"pointer"},
  outlineDark:{display:"inline-flex",alignItems:"center",justifyContent:"center",gap:8,background:"transparent",color:"#fff",border:"1px solid rgba(255,255,255,.3)",borderRadius:11,padding:"12px 20px",fontSize:13,fontWeight:700,letterSpacing:".04em",cursor:"pointer"},
};
function iconBtn(active,danger){ return {width:32,height:32,display:"grid",placeItems:"center",borderRadius:8,cursor:"pointer",border:"1px solid var(--sand-200)",background:"#fff",color:danger?"var(--pm-coral)":"var(--sand-600)",transition:"all .15s"}; }
function iconBtnSm(danger){ return {flex:1,height:28,display:"grid",placeItems:"center",borderRadius:7,cursor:"pointer",border:"1px solid var(--sand-200)",background:"#fff",color:danger?"var(--pm-coral)":"var(--sand-600)"}; }

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
